#!name=酷狗音乐 · 去广告（开屏 / 底栏视频·VIP / 折扣推销）
#!desc=基于酷狗音乐 iOS 20.8.7 抓包（quantumult-x-2026-10-27-184808.har）整理：去除开屏广告、底栏「视频」分类与「会员/VIP」入口、会员中心折扣广告、首页浮标/侧边栏/弹窗等广告位。需开启 HTTPS 解密。

# ============================================================
# 一、广告 SDK / 上报（直接阻断，不影响听歌）
# ============================================================
[filter_local]

# 广点通 & 腾讯广告 SDK（开屏、激励视频素材与上报）
host, us.l.qq.com, reject
host, sdkreport.e.qq.com, reject
host, ad.tencentmusic.com, reject
host, tmeadcomm.y.qq.com, reject
host, tmead.y.qq.com, reject
host, xs.gdt.qq.com, reject
host, tangram.e.qq.com, reject
host-suffix, pgdt.gtimg.cn, reject
host-suffix, canvas-cdn.gdt.qq.com, reject
host-suffix, adsmind.gdtimg.com, reject

# 酷狗广告曝光 / 点击上报
url-regex, ^https?://gateway\.kugou\.com/adp/stat/v1/expose, reject
url-regex, ^https?://gateway\.kugou\.com/ads\.gateway/v3/stat_(expose|click), reject
url-regex, ^https?://gateway\.kugou\.com/v1/exposureupload, reject

# 零散广告位（无法安全改写 JSON 的，直接拒绝）
url-regex, ^https?://gateway\.kugou\.com/adp/ad/v1/multi_page_pendant, reject
url-regex, ^https?://gateway\.kugou\.com/delegateadapter/v1/getSingleCard, reject
url-regex, ^https?://fx\.service\.kugou\.com/mfx-kugoulive/ad/query_all, reject
url-regex, ^https?://vipos\.kugou\.com/v1/ad_coupon/info, reject
url-regex, ^https?://welfare\.kugou\.com/popup/v1/info, reject

# ============================================================
# 二、需要保留 JSON 结构、只删广告字段的接口（走脚本）
# ============================================================
[rewrite_local]

# —— 开屏广告 ——
^https?://gateway\.kugou\.com/ads\.gateway/v4/mobile_splash url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js
^https?://gateway\.kugou\.com/v4/mobile_splash_sort url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js

# —— 底栏：删除「视频」分类；清空底栏气泡广告（会员专区/赚钱等）——
^https?://gateway\.kugou\.com/card/v1/pxy/listen url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js
^https?://gateway\.kugou\.com/pxy/v1/combo/(startup|user) url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js

# —— 会员中心：删掉「1折开月卡」等折扣/联名/0元购广告 ——
^https?://gateway\.kugou\.com/(adservice|ads\.service)/v3/vip_center url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js

# —— 首页浮标、侧边栏、我的页、金刚区、任务入口广告 ——
^https?://gateway\.kugou\.com/ads\.gateway/v2/(mobile_link|sidebar_link|sidebar_top_card|task_center_entrance) url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js
^https?://gateway\.kugou\.com/ads\.gateway/v3/mine_link url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js
^https?://gateway\.kugou\.com/adp/ad/v1/home_combine url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js

# —— 营销 / 会员 / 折扣弹窗 ——
^https?://(gateway|gatewayretry)\.kugou\.com/aterouter/v2/get_dialog url script-response-body https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/AdBlock/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90/%E9%85%B7%E7%8B%97%E9%9F%B3%E4%B9%90.js

# ============================================================
# 三、MITM 主机名
# ============================================================
[mitm]
hostname = %APPEND% gateway.kugou.com, gatewayretry.kugou.com

