#!name=网易云 MUSIC_U 抓取 → BoxJS
#!desc=抓取网易云客户端 eapi/xeapi/weapi 等接口请求 Cookie 中的 MUSIC_U，写入 BoxJS 供复制使用（只读不改包、不影响播放）
#!author=you
#!homepage=
#!icon=https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/2d/e8/1b/2de81bfd-29a0-d067-63c3-38315cc1661a/AppIcon-1x_U007emarketing-0-9-0-0-85-220-0.png/460x0w.webp
#!category=网易云

# ============ 使用前必改 ============
# 把下面 YOUR_NAME/YOUR_REPO 换成你自己的 raw 脚本地址（或把脚本放到任意可访问的 https 地址）
# 例：https://raw.githubusercontent.com/abc/scripts/main/netease-music-u/wyy_music_u.js
#     或 https://cdn.jsdelivr.net/gh/abc/scripts@main/netease-music-u/wyy_music_u.js
# ===================================

# 正则说明：\/x?w?e?api\/ 同时匹配 api / eapi / wapi / weapi / xapi / xeapi / xweapi
#           interface\d? 匹配 interface.music.163.com、interface3.music.163.com 等
[rewrite_local]
^https?:\/\/interface\d?\.music\.163\.com\/x?w?e?api\/vipauth\/app\/auth\/(soundquality\/)?query url script-request-header https://raw.githubusercontent.com/xiaozei0707/QuantumultX/refs/heads/main/1/wyy_music_u.js
[mitm]
hostname = %APPEND% *.music.163.com
